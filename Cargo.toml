[package]
name = "atmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A tmux control plane for terminal coding agents"
license = "MIT"
repository = "https://github.com/ryanmurf/atmux"
readme = "README.md"
keywords = ["tmux", "tui", "agents", "codex", "claude"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["pulse"]
pulse = ["dep:jiff", "dep:rand", "dep:rusqlite", "dep:sqlite-handle-guard"]
pulse-postgres = [
    "pulse",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
]

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.8"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22.1"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
fd-command-cwd = { path = "crates/fd-command-cwd" }
futures-core = "0.3.32"
fs2 = "0.4.3"
getrandom = "0.3.4"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
if-addrs = "0.15.0"
jiff = { version = "0.2.35", optional = true }
mdns-sd = "0.20.3"
rand = { version = "0.9.2", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rmcp = { version = "3.1.0", features = ["transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"], optional = true }
sqlite-handle-guard = { path = "crates/sqlite-handle-guard", optional = true }
rustix = { version = "1.1.4", features = ["fs", "process"] }
rustls = "0.23.36"
rustls-pemfile = "2.2.0"
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
shell-words = "1.1.1"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-jiff-0_2", "with-serde_json-1"], optional = true }
tokio-postgres-rustls = { version = "0.14.0", optional = true }
tokio-rustls = "0.26.4"
toml = "1.1.4"
unicode-width = "0.2.2"
xattr = "1.6.1"
sysinfo = { version = "0.38.4", default-features = false, features = ["component", "system"] }

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.13.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
