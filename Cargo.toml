[package]
name = "atmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A tmux control plane for terminal coding agents"
license = "MIT"
repository = "https://github.com/ryanmurf/atmux"
readme = "README.md"
keywords = ["tmux", "tui", "agents", "codex", "claude"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.229", features = ["derive"] }
shell-words = "1.1.1"
toml = "1.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
