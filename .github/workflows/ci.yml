name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  web:
    name: Dashboard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: node --check web/app.js
      - run: node --test web/app.test.mjs
      - name: Run browser integration tests
        run: node --test tests/web_mobile_pulse_browser.mjs
        timeout-minutes: 3
      - name: Install Quick Talk browser prerequisites
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Build the production web fixture
        run: cargo build --locked
      - name: Run Quick Talk browser integration
        env:
          ATMUX_TMUX_SOCKET_NAME: atmux-ci-web-${{ github.run_id }}
        run: |
          quick_config="$RUNNER_TEMP/atmux-quick-talk.toml"
          chrome_profile="$RUNNER_TEMP/atmux-quick-talk-chrome"
          printf '%s\n' \
            'session_name = "quick-talk-ci"' \
            'harness = "codex"' \
            'profile = "Default"' \
            '' \
            '[web]' \
            'allow_unauthenticated_loopback = true' \
            > "$quick_config"
          mkdir -p "$chrome_profile"
          tmux -L "$ATMUX_TMUX_SOCKET_NAME" new-session -d -s quick-talk-ci
          ./target/debug/atmux --config "$quick_config" web --bind 127.0.0.1:7356 \
            > "$RUNNER_TEMP/atmux-quick-talk-server.log" 2>&1 &
          atmux_pid=$!
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9224 --user-data-dir="$chrome_profile" about:blank \
            > "$RUNNER_TEMP/atmux-quick-talk-chrome.log" 2>&1 &
          chrome_pid=$!
          cleanup() {
            kill "$chrome_pid" "$atmux_pid" 2>/dev/null || true
            wait "$chrome_pid" "$atmux_pid" 2>/dev/null || true
            tmux -L "$ATMUX_TMUX_SOCKET_NAME" kill-server 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..100}; do
            if curl --fail --silent http://127.0.0.1:7356/api/v1/sessions >/dev/null \
              && curl --fail --silent http://127.0.0.1:9224/json/version >/dev/null; then
              break
            fi
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:7356/api/v1/sessions >/dev/null
          curl --fail --silent http://127.0.0.1:9224/json/version >/dev/null
          node tests/quick_talk_browser.mjs http://127.0.0.1:7356 9224
        timeout-minutes: 3

  helm:
    name: Gateway chart safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: bash deploy/helm/atmux-web/tests/render.sh

  container:
    name: Coordinator container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the full-featured runtime image
        run: bash scripts/build-container.sh atmux-ci
      - name: Smoke test bundled runtime dependencies
        run: |
          image="atmux-ci:${GITHUB_SHA:0:12}"
          docker run --rm "$image" --version
          docker run --rm --entrypoint tmux "$image" -V
          docker run --rm --read-only --entrypoint /bin/sh "$image" \
            -ec 'test "$(id -u)" = 10001; command -v curl; command -v grep; command -v nc; command -v tmux; test ! -w /'

  pulse-postgres:
    name: Pulse PostgreSQL conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atmux_admin
          POSTGRES_PASSWORD: atmux_admin_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atmux_admin -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      ATMUX_PULSE_TEST_POSTGRES_URL: postgresql://atmux_runtime:atmux_runtime_test@127.0.0.1:5432/atmux_pulse_test?sslmode=disable
      PGPASSWORD: atmux_admin_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Create non-bypass Pulse runtime role
        run: >-
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atmux_admin -d postgres
          -c "CREATE ROLE atmux_runtime LOGIN PASSWORD 'atmux_runtime_test'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
      - name: Create disposable Pulse database
        run: >-
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atmux_admin -d postgres
          -c "CREATE DATABASE atmux_pulse_test OWNER atmux_runtime"
      - run: cargo test --locked --features pulse-postgres --test pulse_store_conformance

  check:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The tmux-backed and federation suites skip themselves when tmux is
    # missing. Requiring it here means a runner without tmux fails the build
    # instead of quietly shrinking coverage to nothing.
    env:
      ATMUX_REQUIRE_TMUX: '1'
      # Never let tests inspect or mutate a runner account's default tmux
      # server. Every library/federation command inherits this disposable
      # socket; dedicated smoke fixtures use still narrower per-test sockets.
      ATMUX_TMUX_SOCKET_NAME: atmux-ci-${{ github.run_id }}-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      # macOS exposes its default /var/folders temp root through the /var ->
      # /private/var symlink. Pulse deliberately rejects symlinked ancestry for
      # credential, transcript, and SQLite paths, so keep test fixtures under
      # the runner-owned workspace temp tree instead of weakening production
      # path validation.
      - name: Prepare secure macOS test temp root
        if: runner.os == 'macOS'
        run: |
          secure_tmp="$RUNNER_TEMP/atmux-secure-tmp"
          mkdir -p "$secure_tmp"
          chmod 700 "$secure_tmp"
          secure_tmp_physical="$(cd "$secure_tmp" && pwd -P)"
          test "$secure_tmp" = "$secure_tmp_physical"
          echo "TMPDIR=$secure_tmp_physical" >> "$GITHUB_ENV"
      - name: Report tmux version
        run: tmux -V
      - name: Test transactional Quick Resume helper
        if: runner.os == 'Linux'
        run: bash tests/resume_tron_transactional.sh
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Clean disposable tmux server
        if: always()
        run: tmux -L "$ATMUX_TMUX_SOCKET_NAME" kill-server || true
