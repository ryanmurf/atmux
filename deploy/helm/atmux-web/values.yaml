host: atmux.murphytek.com

# atmux continues to run on tron so it can manage the host tmux server. The
# gateway is deliberately limited to this single private-node endpoint.
atmux:
  hostAddress: 192.168.0.109
  hostPort: 7345
  # The server certificate on Tron is issued to this DNS name. Nginx connects
  # by private IP but still validates this exact certificate identity.
  tlsServerName: tron
  proxyTokenSecret: atmux-proxy-token
  # A client certificate plus the private atmux CA. The gateway verifies the
  # host certificate and presents this identity to the host TLS listener.
  tlsSecret: atmux-gateway-tls

# The safe default preserves the deployed gateway-only topology above. Enabling
# this block runs the full atmux web/MCP/Pulse coordinator in the same Pod and
# changes nginx's upstream to its loopback listener. Host tmux servers and agent
# processes remain on their owner machines.
server:
  enabled: false
  # Required, digest-pinned image when enabled, for example:
  # localhost:32000/atmux@sha256:<64 lowercase hex characters>
  image: ""
  imagePullPolicy: IfNotPresent
  node:
    id: home
    label: Home
  # Existing Secret used by the public gateway. The atmux coordinator reads the
  # same token through a file; the value is never rendered into a ConfigMap.
  proxyTokenSecret: atmux-proxy-token
  # Existing clientAuth certificate/key plus atmux-lan-ca CA. The coordinator
  # uses this identity for native Rustls mutual-TLS connections to every host.
  tlsSecret: atmux-gateway-tls
  # One existing Secret with a separate key for each machine entry's tokenKey.
  federationTokenSecret: atmux-node-tokens
  # Production overrides use the reviewed private IPs whose IP SANs are in the
  # host certificates. DNS aliases and mDNS are intentionally not used in K8s.
  machines: []
  # Example shape (keep disabled defaults environment-neutral):
  # - id: tron
  #   label: Tron
  #   address: 192.168.0.109
  #   port: 7345
  #   tokenKey: tron
  pulse:
    serve: true
    # Explicit account/profile metadata is safe configuration, not
    # authentication. These names match the owner nodes so pull federation can
    # attach their rows; owner-local config paths and collection settings are
    # deliberately absent from Kubernetes.
    accounts:
      - id: 4
        identity: ryanmurf@gmail.com
        displayName: Ryan
        profiles:
          - {name: claude-hd, vendor: anthropic-oauth}
          - {name: claude-max, vendor: anthropic-oauth}
          - {name: codex, vendor: openai-codex}
          - {name: grok, vendor: xai-grok}
          - {name: gemini, vendor: gemini}
          - {name: antigravity, vendor: antigravity}
  persistence:
    existingClaim: ""
    storageClass: microk8s-hostpath
    size: 2Gi
    accessMode: ReadWriteOnce
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  # External Secret contents are not visible to Helm. Bump this explicit,
  # non-secret revision when rotating a mounted token or TLS identity.
  secretRevision: v1

oauth:
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
  # Bump this value whenever all browser sessions must be invalidated. Keeping
  # the version in the cookie name makes rotation explicit and leaves no old
  # cookie decryptable by accident.
  sessionVersion: v2
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  secretName: atmux-oauth
  # Exact Google identities authorized to control the tmux host. For a public
  # ingress, Helm accepts only the explicitly reviewed addresses encoded in
  # the chart; never use a broad public domain here.
  allowedEmails: []
  issuerUrl: https://herodevs.dev/realms/usage
  # Google-only login is enforced twice: the dedicated Keycloak browser flow
  # and OAuth2 Proxy's required identity_provider=google token claim. The OIDC
  # proxy never treats a mutable kc_idp_hint parameter as an auth boundary.
  # OAuth2 Proxy talks only to Keycloak's public issuer. Do not broaden this
  # to all internet egress: Google login itself happens between the browser
  # and Keycloak.
  keycloakEgressCidrs:
    - 66.7.119.163/32
  # OAuth2 Proxy trusts forwarded headers only from the ingress controller's
  # pod subnet. Never use 0.0.0.0/0 or ::/0 here.
  trustedProxyCidrs:
    - 10.1.112.0/24

gateway:
  image: nginxinc/nginx-unprivileged:1.31.1-alpine@sha256:cc300bd2e8776708a8c2c8686a74f06eadf221c5ce01e85d0e821955d7a730ab
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 250m, memory: 128Mi}

ingress:
  # Public routing is a separate, reviewed opt-in. The safe default must never
  # recreate an Ingress during an unrelated Helm upgrade.
  enabled: false
  className: public
  clusterIssuer: lets-encrypt
